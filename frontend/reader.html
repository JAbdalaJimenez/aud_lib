<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="description" content="AudioLib — Lector de audiolibros con síntesis de voz y resaltado en tiempo real.">
  
  <!-- PWA & Mobile Meta Tags -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#1F2833">
  <link rel="icon" type="image/png" href="icons/favicon-32.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon-180.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

  <title>AudioLib — Leyendo...</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>

  <div class="reader-layout">

    <!-- Reader Header -->
    <header class="reader-header">
      <button class="back-btn" id="btn-back" onclick="window.location.href='index.html'">
        <span class="icon">
          <svg viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"/></svg>
        </span>
        Biblioteca
      </button>
      <div class="book-info">
        <h1 id="reader-title">Cargando...</h1>
        <div class="author-name" id="reader-author"></div>
      </div>
    </header>

    <!-- Text Content -->
    <main class="reader-content" id="reader-content">
      <!-- Loading state -->
      <div class="reader-loading" id="reader-loading">
        <div class="spinner"></div>
        <div class="loading-text">Cargando libro...</div>
      </div>

      <!-- Text will be rendered here -->
      <div class="text-container" id="text-container" style="display: none;"></div>
    </main>

    <!-- Player Bar -->
    <div class="player-bar" id="player-bar" style="display: none;">
      <!-- Progress track -->
      <div class="progress-track" id="progress-track">
        <div class="progress-played" id="progress-played"></div>
      </div>

      <div class="player-controls">
        <!-- Left: Voice selector -->
        <div class="control-group">
          <select class="voice-select" id="voice-select" title="Seleccionar voz">
            <option value="">Cargando voces...</option>
          </select>
        </div>

        <!-- Center: Play controls -->
        <div class="control-group center">
          <button class="btn-play" id="btn-play" title="Reproducir">
            <span class="icon">
              <svg viewBox="0 0 24 24" fill="currentColor" stroke="none"><polygon points="6 3 20 12 6 21 6 3"/></svg>
            </span>
          </button>
        </div>

        <!-- Right: Speed control -->
        <div class="control-group">
          <div class="speed-control">
            <label for="speed-range">Vel</label>
            <input type="range" id="speed-range" min="0.5" max="2" step="0.1" value="1">
            <span class="speed-value" id="speed-value">1x</span>
          </div>
        </div>
      </div>
    </div>

  </div>

  <!-- Toast container -->
  <div class="toast-container" id="toast-container"></div>

  <script src="js/config.js"></script>
  <script src="js/reader.js"></script>

  <!-- Firebase -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.17.0/firebase-app.js";
    import { getAnalytics } from "https://www.gstatic.com/firebasejs/12.17.0/firebase-analytics.js";

    const firebaseConfig = {
      apiKey: "AIzaSyBW58LsP13EfuZp9rc_BRAqWolF-M8iTXM",
      authDomain: "audlib-6db4d.firebaseapp.com",
      projectId: "audlib-6db4d",
      storageBucket: "audlib-6db4d.firebasestorage.app",
      messagingSenderId: "362487494808",
      appId: "1:362487494808:web:b3278984aed2c74c0478ed",
      measurementId: "G-56CVEMJ6RJ"
    };

    const app = initializeApp(firebaseConfig);
    const analytics = getAnalytics(app);
  </script>
</body>
</html>
